  #   units: 20000   # TL tutarı doğrudan

# ============================================================
# REBALANCING (5/25 KURALI)
# ============================================================
rebalance:
  abs_threshold_pct: 5.0
  rel_threshold_pct: 25.0

# ============================================================
# TEFAS FON TÜRÜ (sadece type: fund olan araçlar için)
# ============================================================
tefas:
  default_kind: "AUTO"
  kind_overrides: {}
